<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpace - Hệ thống quản lý học nhóm và tài liệu</title>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Login / Register -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h1><i class="fas fa-book-open" style="color:var(--primary)"></i> StudySpace</h1>
            <p class="subtitle">Quản lý học nhóm &amp; tài liệu</p>

            <div class="tab-row">
                <button id="tabLogin" class="active" onclick="switchTab('login')">Đăng nhập</button>
                <button id="tabRegister" onclick="switchTab('register')">Đăng ký</button>
            </div>

            <div id="loginAlert"></div>

            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="admin@studyspace.com" value="admin@studyspace.com">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Nhập mật khẩu" value="Admin@123">
                </div>
                <button class="btn btn-primary" style="width:100%;justify-content:center;padding:0.75rem" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập
                </button>
            </div>

            <div id="registerForm" style="display:none">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" id="regName" class="form-control" placeholder="Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="regPhone" class="form-control" placeholder="0900000000">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 6 ký tự">
                </div>
                <button class="btn btn-primary" style="width:100%;justify-content:center;padding:0.75rem" onclick="register()">
                    <i class="fas fa-user-plus"></i> Tạo tài khoản
                </button>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div id="mainLayout" class="layout" style="display:none">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-book-open"></i> StudySpace</h2>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active" onclick="showPage('dashboard')" data-page="dashboard">
                    <i class="fas fa-chart-pie"></i> Tổng quan
                </a>
                <a class="nav-item" onclick="showPage('groups')" data-page="groups">
                    <i class="fas fa-users"></i> Nhóm học
                </a>
                <a class="nav-item" onclick="showPage('documents')" data-page="documents">
                    <i class="fas fa-file-alt"></i> Tài liệu
                </a>
                <a class="nav-item" onclick="showPage('schedules')" data-page="schedules">
                    <i class="fas fa-calendar-alt"></i> Lịch học
                </a>
                <a class="nav-item" onclick="showPage('progress')" data-page="progress">
                    <i class="fas fa-tasks"></i> Tiến độ
                </a>
                <a class="nav-item" onclick="showPage('chat')" data-page="chat">
                    <i class="fas fa-comments"></i> Trò chuyện
                </a>
                <a class="nav-item" onclick="showPage('notifications')" data-page="notifications">
                    <i class="fas fa-bell"></i> Thông báo <span id="navUnread" class="badge danger" style="display:none;margin-left:auto"></span>
                </a>
                <a class="nav-item" id="navUsers" onclick="showPage('users')" data-page="users" style="display:none">
                    <i class="fas fa-user-shield"></i> Người dùng
                </a>
                <a class="nav-item" style="margin-top:auto;border-top:1px solid rgba(255,255,255,0.1)" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <!-- Dashboard -->
            <div id="page-dashboard" class="page-content">
                <div class="page-header">
                    <h1>Tổng quan</h1>
                    <span id="currentUser"></span>
                </div>
                <div class="stats-grid" id="dashboardStats"></div>
                <div class="card">
                    <div class="card-header"><h2>Nhóm hoạt động nổi bật</h2></div>
                    <div id="topGroupsTable"></div>
                </div>
                <div class="card">
                    <div class="card-header"><h2>Hoạt động 7 ngày qua</h2></div>
                    <div id="activityTable"></div>
                </div>
            </div>

            <!-- Groups -->
            <div id="page-groups" class="page-content" style="display:none">
                <div class="page-header">
                    <h1>Nhóm học</h1>
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                        <input id="groupSearch" class="form-control" style="width:240px" placeholder="Tìm theo tên, môn..." oninput="loadGroups()">
                        <button class="btn btn-outline" onclick="showJoinGroupModal()"><i class="fas fa-link"></i> Tham gia</button>
                        <button class="btn btn-primary" onclick="showCreateGroupModal()"><i class="fas fa-plus"></i> Tạo nhóm</button>
                    </div>
                </div>
                <div class="card">
                    <div id="groupsTable"></div>
                </div>
            </div>

            <!-- Documents -->
            <div id="page-documents" class="page-content" style="display:none">
                <div class="page-header">
                    <h1>Tài liệu</h1>
                    <div style="display:flex;gap:0.5rem">
                        <select id="docGroupFilter" class="form-control" onchange="loadDocuments()" style="width:240px">
                            <option value="">-- Chọn nhóm --</option>
                        </select>
                        <button class="btn btn-primary" onclick="showUploadDocModal()"><i class="fas fa-upload"></i> Tải lên</button>
                    </div>
                </div>
                <div class="card">
                    <div id="documentsTable"></div>
                </div>
            </div>

            <!-- Schedules -->
            <div id="page-schedules" class="page-content" style="display:none">
                <div class="page-header">
                    <h1>Lịch học</h1>
                    <div style="display:flex;gap:0.5rem">
                        <select id="scheduleGroupFilter" class="form-control" onchange="loadSchedules()" style="width:240px">
                            <option value="">-- Lịch sắp tới của tôi --</option>
                        </select>
                        <button class="btn btn-primary" onclick="showCreateScheduleModal()"><i class="fas fa-plus"></i> Tạo lịch</button>
                    </div>
                </div>
                <div class="card">
                    <div id="schedulesTable"></div>
                </div>
            </div>

            <!-- Progress -->
            <div id="page-progress" class="page-content" style="display:none">
                <div class="page-header">
                    <h1>Tiến độ học tập</h1>
                    <div style="display:flex;gap:0.5rem">
                        <select id="progressGroupFilter" class="form-control" onchange="loadProgress()" style="width:240px">
                            <option value="">-- Tiến độ của tôi --</option>
                        </select>
                        <button class="btn btn-primary" onclick="showCreateProgressModal()"><i class="fas fa-plus"></i> Thêm mục tiêu</button>
                    </div>
                </div>
                <div class="card">
                    <div id="progressTable"></div>
                </div>
            </div>

            <!-- Chat -->
            <div id="page-chat" class="page-content" style="display:none">
                <div class="page-header">
                    <h1>Trò chuyện nhóm</h1>
                    <select id="chatGroupSelect" class="form-control" onchange="loadChat()" style="width:280px">
                        <option value="">-- Chọn nhóm --</option>
                    </select>
                </div>
                <div class="card">
                    <div id="chatList" class="chat-list"></div>
                    <div class="chat-input-row">
                        <input id="chatInput" class="form-control" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendChat()">
                        <button class="btn btn-primary" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- Notifications -->
            <div id="page-notifications" class="page-content" style="display:none">
                <div class="page-header">
                    <h1>Thông báo</h1>
                    <button class="btn btn-outline" onclick="markAllRead()"><i class="fas fa-check-double"></i> Đánh dấu đã đọc tất cả</button>
                </div>
                <div class="card">
                    <div id="notificationsList"></div>
                </div>
            </div>

            <!-- Users (admin only) -->
            <div id="page-users" class="page-content" style="display:none">
                <div class="page-header">
                    <h1>Quản lý người dùng</h1>
                    <input id="userSearch" class="form-control" placeholder="Tìm tên / email..." oninput="loadUsers()" style="width:280px">
                </div>
                <div class="card">
                    <div id="usersTable"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="modalRoot"></div>
    <script src="/js/app.js"></script>
</body>
</html>
